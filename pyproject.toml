[project]
name = "duckrun"
version = "0.1.0"
description = "DuckRun — Ryan's own LM Studio-style local AI app: GUI + model manager + local OpenAI-compatible server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
    "pyyaml>=6.0",
]

[project.scripts]
duckrun = "duckrun.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["duckrun*"]
